<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Properties</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6F2E9;
    --card:#FFFFFF;
    --ink:#26221C;
    --ink-soft:#63594A;
    --line:#E4DDCC;
    --green:#2F4A3C;
    --green-bg:#E7EEE8;
    --amber:#8A6215;
    --amber-bg:#FAF0D8;
    --red:#8C3626;
    --red-bg:#F7E4DE;
    --gray-bg:#EFECE3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    padding:32px 20px 80px;
  }
  .wrap{max-width:920px;margin:0 auto;}
  header{margin-bottom:28px;}
  header h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:28px;
    margin:0 0 4px;
  }
  header p{margin:0;color:var(--ink-soft);font-size:14px;}
  .area{
    font-family:'Fraunces', serif;
    font-size:15px;
    color:var(--ink-soft);
    margin:32px 0 10px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 18px;
  }
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;}
  .card-top h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:16px;
    margin:0;
  }
  .badge{
    font-size:11px;
    padding:3px 9px;
    border-radius:20px;
    font-weight:500;
    white-space:nowrap;
    flex-shrink:0;
  }
  .badge.green{background:var(--green-bg);color:var(--green);}
  .badge.amber{background:var(--amber-bg);color:var(--amber);}
  .badge.red{background:var(--red-bg);color:var(--red);}
  .badge.gray{background:var(--gray-bg);color:var(--ink-soft);}
  label{display:block;font-size:11px;color:var(--ink-soft);margin:8px 0 3px;}
  input[type=text], input[type=date]{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:13px;
    padding:6px 8px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--cream);
    color:var(--ink);
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .paid-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .paid-label{font-size:13px;}
  .paid-toggle{
    border:1px solid var(--line);
    background:var(--cream);
    font-size:12px;
    padding:5px 12px;
    border-radius:20px;
    cursor:pointer;
    font-weight:500;
  }
  .paid-toggle.paid{background:var(--green-bg);color:var(--green);border-color:var(--green-bg);}
  .paid-toggle.unpaid{background:var(--red-bg);color:var(--red);border-color:var(--red-bg);}
  .paid-toggle.na{background:var(--gray-bg);color:var(--ink-soft);border-color:var(--gray-bg);}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;}
  .seg button{
    border:none;background:var(--cream);font-size:12px;padding:5px 10px;cursor:pointer;
    color:var(--ink-soft);font-family:'Inter',sans-serif;
  }
  .seg button + button{border-left:1px solid var(--line);}
  .seg button.active.paid{background:var(--green-bg);color:var(--green);}
  .seg button.active.unpaid{background:var(--red-bg);color:var(--red);}
  .seg button.active.na{background:var(--gray-bg);color:var(--ink);}
  .collapse-title{
    display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;user-select:none;
  }
  .collapse-title::after{
    content:'\u25BE';font-size:11px;color:var(--ink-soft);transition:transform 0.15s;
  }
  .collapse-title.collapsed::after{transform:rotate(-90deg);}
  select.currency{
    font-family:'Inter',sans-serif;font-size:12px;padding:3px 6px;
    border:1px solid var(--line);border-radius:6px;background:var(--cream);color:var(--ink);
  }
  .compact-card{
    cursor:pointer;transition:transform 0.08s, box-shadow 0.15s;
  }
  .compact-card:hover{
    transform:translateY(-1px);
    box-shadow:0 2px 8px rgba(38,34,28,0.06);
  }
  .compact-row{
    display:flex;justify-content:space-between;align-items:center;
    font-size:13px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
  }
  .compact-tenant{
    font-size:13px;color:var(--ink-soft);margin-top:4px;
  }
  .compact-alert{
    margin-top:8px;font-size:12px;color:var(--red);display:flex;align-items:center;gap:4px;
  }
  .compact-alert.mild{color:var(--amber);}
  .compact-alert.info{color:var(--ink-soft);}
  .back-btn{
    background:none;border:none;color:var(--ink-soft);font-size:14px;
    cursor:pointer;padding:0;margin-bottom:16px;font-family:'Inter',sans-serif;
  }
  .back-btn:hover{color:var(--ink);}
  .section-title{
    font-family:'Fraunces',serif;font-size:14px;color:var(--ink-soft);
    margin:20px 0 10px;letter-spacing:0.01em;
  }
  .section-divider{
    height:1px;background:var(--line);margin:24px -18px;
  }
  .sub-block{
    background:var(--cream);border-radius:8px;padding:10px 12px;margin-bottom:8px;
  }
  .sub-block-header{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;
  }
  .sub-block-header .name{font-size:13px;font-weight:500;color:var(--ink);}
  .sub-block-body{display:flex;align-items:center;gap:8px;}
  .sub-block-body label{margin:0;flex-shrink:0;white-space:nowrap;}
  .sub-block-body input{margin:0;flex:1;min-width:0;}
  .rr-table{width:100%;border-collapse:collapse;}
  .rr-section-head{
    font-family:'Fraunces',serif;font-size:14px;color:var(--ink-soft);
    padding:16px 4px 8px;
  }
  .rr-row{
    display:grid;grid-template-columns:1fr 1fr auto auto;gap:12px;
    padding:12px 12px;background:var(--card);border:1px solid var(--line);
    border-radius:8px;margin-bottom:6px;align-items:center;
    cursor:pointer;transition:transform 0.08s;
  }
  .rr-row:hover{transform:translateY(-1px);}
  .rr-cell{font-size:13px;}
  .rr-cell.name{font-weight:500;}
  .rr-cell.tenant{color:var(--ink-soft);}
  .rr-cell.amount{text-align:right;color:var(--ink-soft);white-space:nowrap;}
  .rr-totals{
    display:flex;flex-wrap:wrap;gap:16px;padding:12px 16px;
    background:var(--card);border:1px solid var(--line);border-radius:8px;
    margin-bottom:16px;font-size:13px;
  }
  .rr-totals .t-label{color:var(--ink-soft);}
  .rr-totals .t-value{font-family:'Fraunces',serif;margin-left:4px;}
  @media(max-width:520px){
    .rr-row{grid-template-columns:1fr auto;gap:6px;}
    .rr-cell.tenant, .rr-cell.amount{grid-column:span 2;font-size:12px;}
    .rr-cell.amount{text-align:left;}
  }
  .todo-section{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .todo-title{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .todo-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;}
  .todo-item input[type=checkbox]{margin:0;flex-shrink:0;}
  .todo-item span{flex:1;}
  .todo-item.done span{text-decoration:line-through;color:var(--ink-soft);}
  .todo-item button{
    border:none;background:none;color:var(--ink-soft);
    cursor:pointer;font-size:14px;padding:0 4px;flex-shrink:0;
  }
  .todo-add{display:flex;gap:6px;margin-top:6px;}
  .todo-add input{flex:1;}
  .todo-add button{
    border:1px solid var(--line);
    background:var(--card);
    border-radius:6px;
    font-size:13px;
    padding:6px 12px;
    cursor:pointer;
    flex-shrink:0;
  }
  .draft-btn{
    width:100%;
    margin-top:12px;
    border:1px solid var(--line);
    background:var(--cream);
    border-radius:6px;
    font-size:13px;
    padding:8px;
    cursor:pointer;
    font-weight:500;
  }
  .draft-box{margin-top:8px;display:none;}
  .draft-box textarea{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:13px;
    padding:8px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--cream);
    resize:vertical;
    min-height:70px;
  }
  .copy-btn{
    margin-top:6px;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:6px;
    font-size:12px;
    padding:5px 10px;
    cursor:pointer;
  }
  .saved-note{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:28px;}
  .link-btn{
    border:none;background:none;color:var(--ink-soft);
    font-size:12px;text-decoration:underline;cursor:pointer;padding:0;
  }
  .tabs{display:flex;gap:8px;margin-bottom:20px;}
  .tab-btn{
    border:1px solid var(--line);background:var(--card);border-radius:20px;
    font-size:13px;padding:6px 16px;cursor:pointer;color:var(--ink-soft);
  }
  .tab-btn.active{background:var(--green);color:#fff;border-color:var(--green);}
  .metric-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .metric-label{font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  .metric-value{font-family:'Fraunces',serif;font-size:22px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Our properties</h1>
    <p>Tap into any apartment to update the tenant, lease, payments, or to-do list.</p>
  </header>
  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-view="properties">Properties</button>
    <button class="tab-btn" data-view="rentroll">Rent roll</button>
    <button class="tab-btn" data-view="overview">Overview</button>
  </div>
  <div id="content"></div>
  <p class="saved-note">Changes save automatically to this browser. Export a backup regularly.</p>
  <div style="text-align:center;margin-top:8px;">
    <button class="link-btn" onclick="exportBackup()">Export backup</button>
    <span style="color:var(--line);margin:0 12px;">·</span>
    <button class="link-btn" onclick="importBackup()">Import backup</button>
  </div>
</div>

<script>
// Standalone storage: localStorage-backed shim providing the same interface
// as the Claude artifact runtime, so this file works when opened directly
// from disk or hosted anywhere.
window.storage = {
  async get(key) {
    const val = localStorage.getItem(key);
    return val === null ? null : {key, value: val, shared: false};
  },
  async set(key, value) {
    try {
      localStorage.setItem(key, value);
      return {key, value, shared: false};
    } catch(e) {
      console.error('Storage save failed:', e);
      return null;
    }
  },
  async delete(key) {
    localStorage.removeItem(key);
    return {key, deleted: true, shared: false};
  }
};

function exportBackup() {
  const data = {};
  for(let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    data[k] = localStorage.getItem(k);
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'properties-backup-' + new Date().toISOString().split('T')[0] + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    if(!confirm('Import will replace ALL current data with the backup. Continue?')) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      localStorage.clear();
      Object.keys(data).forEach(k => localStorage.setItem(k, data[k]));
      alert('Import complete. Reloading.');
      window.location.reload();
    } catch(err) {
      alert('Failed to import: ' + err.message);
    }
  });
  input.click();
}

const DEFAULT_PROPERTIES = [
  {id:'gc1', area:'Garden City', name:'Apartment 2', rented:true, hidden:false},
  {id:'gc5', area:'Garden City', name:'Apartment 5 (first floor)', rented:true, hidden:false},
  {id:'gc7', area:'Garden City', name:'Apartment 7', rented:true, hidden:false},
  {id:'gc9', area:'Garden City', name:'Apartment 9', rented:true, hidden:false},
  {id:'gc10', area:'Garden City', name:'Apartment 10', rented:true, hidden:false},
  {id:'gc27', area:'Garden City', name:'Apartment 27', rented:true, hidden:false},
  {id:'alegria', area:'Alegría, Sodic West', name:'Villa A226', rented:false, hidden:false},
  {id:'almaza', area:'Almaza Bay, North Coast', name:'Apartment', rented:true, hidden:false},
];

let PROPERTIES = [];
let editingId = null;
let addingNew = false;
let showHidden = false;
let currentView = 'properties';
let detailPropertyId = null;
let paymentHistory = [];
let maintenanceHistory = [];
let taxHistory = [];
let viewMonth = null;
let viewYear = null;
const state = {};

function slugify(name){
  return name.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') + '-' + Date.now().toString(36);
}

function shiftMonthKey(key, delta){
  const [y, m] = key.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function monthLabel(key){
  const [y, m] = key.split('-').map(Number);
  const d = new Date(y, m - 1, 1);
  return d.toLocaleDateString('en-US', {month:'long', year:'numeric'});
}

function isPaidForMonth(propertyId, month){
  return paymentHistory.some(h => h.propertyId === propertyId && h.month === month);
}

function getMaintenanceStatus(propertyId, month){
  const rec = maintenanceHistory.find(h => h.propertyId === propertyId && h.month === month);
  if(!rec) return 'notpaid';
  return rec.status || 'paid';
}

function isTaxPaidForYear(propertyId, year, type){
  return taxHistory.some(h => h.propertyId === propertyId && h.year === year && h.type === type);
}

function googleCalendarUrl(title, dateStr, details){
  const start = new Date(dateStr);
  const end = new Date(start);
  end.setDate(end.getDate() + 1);
  const fmt = dt => dt.toISOString().slice(0,10).replace(/-/g,'');
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: title,
    dates: fmt(start) + '/' + fmt(end),
    details: details
  });
  return 'https://calendar.google.com/calendar/render?' + params.toString();
}

function defaultData(rented){
  return {
    tenant:'', leaseStart:'', leaseEnd:'', rentAmount:'', maintenanceAmount:'',
    realEstateTaxAmount:'', commercialTaxAmount:'',
    currency:'EGP',
    rentalType: rented ? 'new' : 'none',
    oldRentStartYear:'', oldRentBaseAmount:'',
    paid:false, paidMonth:'',
    contractName:'', docsLink:'',
    notes:'',
    utilityChecklist:{electricity:false, gas:false, internet:false, phone:false},
    todos:[]
  };
}

const RENTAL_TYPES = [
  {value:'new', label:'New rental'},
  {value:'old', label:'Old rental (إيجار قديم)'},
  {value:'none', label:'Not rented'}
];

const OLD_RENT_LAW_DATE = new Date('2025-08-04');
const OLD_RENT_TRANSITION_END = new Date('2032-08-04');

const CURRENCIES = ['EGP','USD','EUR'];

function formatMoney(amount, currency){
  const num = parseFloat(amount) || 0;
  return num.toLocaleString() + ' ' + (currency || 'EGP');
}

async function loadPropertyList(){
  try{
    const res = await window.storage.get('property-list', false);
    PROPERTIES = res ? JSON.parse(res.value) : DEFAULT_PROPERTIES.map(p => ({...p}));
  }catch(e){
    PROPERTIES = DEFAULT_PROPERTIES.map(p => ({...p}));
  }
  const gc1 = PROPERTIES.find(p => p.id === 'gc1');
  if(gc1 && gc1.name === 'Apartment 1') gc1.name = 'Apartment 2';
  await savePropertyList();
}

async function savePropertyList(){
  try{
    await window.storage.set('property-list', JSON.stringify(PROPERTIES), false);
  }catch(e){
    console.error('save list failed', e);
  }
}

async function addProperty(name, area, rented){
  const id = slugify(name);
  PROPERTIES.push({id, area, name, rented, hidden:false});
  state[id] = defaultData(rented);
  await savePropertyList();
  await save(id);
  render();
}

async function hideProperty(id){
  const p = PROPERTIES.find(p => p.id === id);
  if(p) p.hidden = true;
  await savePropertyList();
  render();
}

async function unhideProperty(id){
  const p = PROPERTIES.find(p => p.id === id);
  if(p) p.hidden = false;
  await savePropertyList();
  render();
}

async function updatePropertyMeta(id, name, area, rented){
  const p = PROPERTIES.find(p => p.id === id);
  if(p){ p.name = name; p.area = area; p.rented = rented; }
  await savePropertyList();
  render();
}

async function loadAll(){
  await loadPropertyList();
  viewMonth = currentMonthKey();
  viewYear = new Date().getFullYear();
  for(const p of PROPERTIES){
    try{
      const res = await window.storage.get('property:'+p.id, false);
      state[p.id] = res ? JSON.parse(res.value) : defaultData(p.rented);
    }catch(e){
      state[p.id] = defaultData(p.rented);
    }
    if(!state[p.id].rentalType){
      state[p.id].rentalType = p.rented ? 'new' : 'none';
    }
    if(!state[p.id].utilityChecklist){
      state[p.id].utilityChecklist = {electricity:false, gas:false, internet:false, phone:false};
    }
  }
  try{
    const res = await window.storage.get('payments-history', false);
    paymentHistory = res ? JSON.parse(res.value) : [];
  }catch(e){
    paymentHistory = [];
  }
  try{
    const res = await window.storage.get('maintenance-history', false);
    maintenanceHistory = res ? JSON.parse(res.value) : [];
  }catch(e){
    maintenanceHistory = [];
  }
  try{
    const res = await window.storage.get('tax-history', false);
    taxHistory = res ? JSON.parse(res.value) : [];
  }catch(e){
    taxHistory = [];
  }
  render();
}

async function logPayment(propertyId, month, amount, paid){
  paymentHistory = paymentHistory.filter(h => !(h.propertyId === propertyId && h.month === month));
  if(paid) paymentHistory.push({propertyId, month, amount});
  try{
    await window.storage.set('payments-history', JSON.stringify(paymentHistory), false);
  }catch(e){
    console.error('history save failed', e);
  }
}

async function logMaintenance(propertyId, month, amount, status){
  maintenanceHistory = maintenanceHistory.filter(h => !(h.propertyId === propertyId && h.month === month));
  if(status === 'paid' || status === 'na') maintenanceHistory.push({propertyId, month, amount, status});
  try{
    await window.storage.set('maintenance-history', JSON.stringify(maintenanceHistory), false);
  }catch(e){
    console.error('maintenance history save failed', e);
  }
}

async function logTax(propertyId, year, type, amount, paid){
  taxHistory = taxHistory.filter(h => !(h.propertyId === propertyId && h.year === year && h.type === type));
  if(paid) taxHistory.push({propertyId, year, type, amount});
  try{
    await window.storage.set('tax-history', JSON.stringify(taxHistory), false);
  }catch(e){
    console.error('tax history save failed', e);
  }
}

async function save(id){
  try{
    await window.storage.set('property:'+id, JSON.stringify(state[id]), false);
  }catch(e){
    console.error('save failed', e);
  }
}

function currentMonthKey(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

function statusBadge(p){
  const d = state[p.id];
  if(!d || d.rentalType === 'none' || (!d.rentalType && !p.rented)){
    return {cls:'gray', text:'Not rented'};
  }
  if(d.rentalType === 'old'){
    return {cls:'amber', text:'Old rent'};
  }
  if(!d.leaseEnd){
    return {cls:'gray', text:'No lease date yet'};
  }
  const end = new Date(d.leaseEnd);
  const today = new Date();
  const daysLeft = Math.round((end - today) / 86400000);
  if(daysLeft < 0) return {cls:'red', text:'Renewal overdue'};
  if(daysLeft <= 30) return {cls:'amber', text:'Renews in '+daysLeft+' days'};
  return {cls:'green', text:'Active'};
}

function relevantDrafts(p){
  const d = state[p.id];
  const name = d.tenant ? d.tenant.split(' ')[0] : 'there';
  const drafts = [];
  const cm = currentMonthKey();
  const monthName = monthLabel(cm).split(' ')[0];
  const isRented = d.rentalType === 'new' || d.rentalType === 'old';

  if(!isRented){
    drafts.push({key:'none', label:'Not rented', priority:1, text:'This apartment is not currently rented — no tenant to message.'});
    return drafts;
  }

  if(!isPaidForMonth(p.id, cm) && (parseFloat(d.rentAmount) || 0) > 0){
    drafts.push({
      key:'rent-nudge', label:'Rent nudge (' + monthName + ')', priority:1,
      text:'Ezayak ' + name + ', hope you\u2019re doing well. Just a gentle nudge about the rent for ' + monthName + ' — whenever you\u2019re able, let me know. Shukran!'
    });
  }

  if(getMaintenanceStatus(p.id, cm) === 'notpaid' && (parseFloat(d.maintenanceAmount) || 0) > 0){
    drafts.push({
      key:'maint-nudge', label:'Maintenance nudge (' + monthName + ')', priority:2,
      text:'Ahlan ' + name + ', a quick reminder about the maintenance fee for ' + monthName + '. Whenever it\u2019s convenient. Shukran!'
    });
  }

  if(d.rentalType === 'new' && d.leaseEnd){
    const end = new Date(d.leaseEnd);
    const daysLeft = Math.round((end - new Date()) / 86400000);
    const dateStr = end.toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'});
    if(daysLeft < 0){
      drafts.push({
        key:'renewal-overdue', label:'Renewal overdue', priority:0,
        text:'Ahlan ' + name + ', I noticed the lease passed its end date on ' + dateStr + '. No rush at all \u2014 just checking in on how you\u2019d like to proceed.'
      });
    } else if(daysLeft <= 60){
      drafts.push({
        key:'renewal-soon', label:'Renewal in ' + daysLeft + ' days', priority:3,
        text:'Ezayak ' + name + ', a heads up: the lease comes up for renewal on ' + dateStr + '. Let me know if you\u2019d like to continue so we can sort the details together.'
      });
    }
  }

  if(d.rentalType === 'old'){
    const monthIdx = new Date().getMonth();
    if(monthIdx >= 5 && monthIdx <= 7 && (parseFloat(d.rentAmount) || 0) > 0){
      const current = parseFloat(d.rentAmount);
      const newAmt = Math.round(current * 1.15);
      drafts.push({
        key:'old-rent-increase', label:'Annual 15% increase notice', priority:4,
        text:'Ahlan ' + name + ', wanted to give you advance notice that starting August 4, the monthly rent adjusts to ' + formatMoney(newAmt, d.currency) + ' as per the annual increase under the new rent law. Happy to discuss if you have any questions.'
      });
    }
  }

  drafts.push({
    key:'checkin', label:'Warm check-in', priority:99,
    text:'Ezayak ' + name + ', just checking in \u2014 everything good with the apartment? Let me know if anything needs attention.'
  });

  drafts.sort((a,b) => a.priority - b.priority);
  return drafts;
}

function renderCompactCard(p){
  const d = state[p.id];
  const badge = statusBadge(p);
  const isRented = d.rentalType === 'new' || d.rentalType === 'old';

  const card = document.createElement('div');
  card.className = 'card compact-card';
  card.setAttribute('role', 'button');
  card.setAttribute('tabindex', '0');
  const openDetail = () => { detailPropertyId = p.id; window.scrollTo(0,0); render(); };
  card.addEventListener('click', openDetail);
  card.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openDetail(); } });

  const header = document.createElement('div');
  header.className = 'card-top';
  header.innerHTML = '<h2>' + p.name + '</h2><span class="badge ' + badge.cls + '">' + badge.text + '</span>';
  card.appendChild(header);

  const tenant = document.createElement('div');
  tenant.className = 'compact-tenant';
  tenant.textContent = isRented ? (d.tenant || 'Tenant name not set') : (p.area);
  card.appendChild(tenant);

  if(isRented){
    const rentRow = document.createElement('div');
    rentRow.className = 'compact-row';
    const paid = isPaidForMonth(p.id, viewMonth);
    const rentLabel = document.createElement('span');
    rentLabel.style.color = 'var(--ink-soft)';
    rentLabel.textContent = 'Rent for ' + monthLabel(viewMonth).split(' ')[0];
    const rentStatus = document.createElement('span');
    rentStatus.style.cssText = 'font-size:12px;padding:3px 10px;border-radius:20px;font-weight:500;' +
      (paid ? 'background:var(--green-bg);color:var(--green);' : 'background:var(--red-bg);color:var(--red);');
    rentStatus.textContent = paid ? 'Paid' : (d.rentAmount ? 'Not paid — ' + formatMoney(d.rentAmount, d.currency) : 'Not paid');
    rentRow.appendChild(rentLabel);
    rentRow.appendChild(rentStatus);
    card.appendChild(rentRow);
  }

  const alerts = [];
  const thisYear = new Date().getFullYear();
  if(d.rentalType === 'new' && d.leaseEnd){
    const daysLeft = Math.round((new Date(d.leaseEnd) - new Date()) / 86400000);
    if(daysLeft < 0) alerts.push({txt:'Renewal overdue', level:'red'});
    else if(daysLeft <= 30) alerts.push({txt:'Renews in ' + daysLeft + ' days', level:'mild'});
  }
  if(isRented && getMaintenanceStatus(p.id, viewMonth) === 'notpaid' && (parseFloat(d.maintenanceAmount) || 0) > 0){
    alerts.push({txt:'Maintenance not paid', level:'mild'});
  }
  if((parseFloat(d.realEstateTaxAmount) || 0) > 0 && !isTaxPaidForYear(p.id, thisYear, 'realestate')){
    alerts.push({txt:'Real estate tax pending', level:'mild'});
  }
  const openTodos = d.todos.filter(t => !t.done).length;
  if(openTodos) alerts.push({txt:openTodos + ' open to-do' + (openTodos > 1 ? 's' : ''), level:'info'});

  if(alerts.length){
    const a = alerts[0];
    const alertDiv = document.createElement('div');
    alertDiv.className = 'compact-alert' + (a.level === 'mild' ? ' mild' : a.level === 'info' ? ' info' : '');
    alertDiv.textContent = a.txt + (alerts.length > 1 ? '  ·  +' + (alerts.length - 1) + ' more' : '');
    card.appendChild(alertDiv);
  }

  return card;
}

function render(){
  const container = document.getElementById('content');
  container.innerHTML = '';

  if(currentView === 'overview'){
    container.appendChild(renderOverview());
    return;
  }

  if(currentView === 'rentroll'){
    container.appendChild(renderMonthNav());
    container.appendChild(renderRentRoll());
    return;
  }

  if(detailPropertyId){
    const p = PROPERTIES.find(pr => pr.id === detailPropertyId);
    if(!p){ detailPropertyId = null; render(); return; }

    const backBtn = document.createElement('button');
    backBtn.className = 'back-btn';
    backBtn.textContent = '\u2190 Back to properties';
    backBtn.addEventListener('click', () => { detailPropertyId = null; editingId = null; render(); });
    container.appendChild(backBtn);

    const areaCrumb = document.createElement('div');
    areaCrumb.style.cssText = 'font-size:12px;color:var(--ink-soft);margin-bottom:12px;';
    areaCrumb.textContent = p.area;
    container.appendChild(areaCrumb);

    const datalist = document.createElement('datalist');
    datalist.id = 'areas-list';
    [...new Set(PROPERTIES.map(x => x.area))].forEach(a => {
      const opt = document.createElement('option');
      opt.value = a;
      datalist.appendChild(opt);
    });
    container.appendChild(datalist);

    container.appendChild(renderMonthNav());
    container.appendChild(renderYearNav());
    container.appendChild(renderCard(p));
    return;
  }

  container.appendChild(renderMonthNav());

  const datalist = document.createElement('datalist');
  datalist.id = 'areas-list';
  [...new Set(PROPERTIES.map(p => p.area))].forEach(a => {
    const opt = document.createElement('option');
    opt.value = a;
    datalist.appendChild(opt);
  });
  container.appendChild(datalist);

  const visible = PROPERTIES.filter(p => showHidden ? true : !p.hidden);
  const areas = [...new Set(visible.map(p => p.area))];
  for(const area of areas){
    const areaHeading = document.createElement('div');
    areaHeading.className = 'area';
    areaHeading.textContent = area;
    container.appendChild(areaHeading);

    const grid = document.createElement('div');
    grid.className = 'grid';
    visible.filter(p => p.area === area).forEach(p => grid.appendChild(renderCompactCard(p)));
    container.appendChild(grid);
  }

  container.appendChild(renderAddSection());
  container.appendChild(renderHiddenToggle());
}

      card.appendChild(startYrInput);

      const baseLabel = document.createElement('label');
      baseLabel.textContent = 'Base rent before 2025 (per month)';
      card.appendChild(baseLabel);
      const baseInput = document.createElement('input');
      baseInput.type = 'text';
      baseInput.inputMode = 'numeric';
      baseInput.value = d.oldRentBaseAmount;
      baseInput.placeholder = 'e.g. 1000';
      baseInput.addEventListener('change', e => { d.oldRentBaseAmount = e.target.value; save(p.id); render(); });
      card.appendChild(baseInput);

      const currentRent = parseFloat(d.rentAmount) || 0;
      if(currentRent > 0){
        const projWrap = document.createElement('div');
        projWrap.style.cssText = 'margin-top:12px;padding-top:12px;border-top:1px solid var(--line);';
        const projTitle = document.createElement('div');
        projTitle.className = 'todo-title collapse-title collapsed';
        projTitle.innerHTML = '<span>15% annual rent path (until 2032)</span>';
        projWrap.appendChild(projTitle);
        const projBody = document.createElement('div');
        projBody.style.display = 'none';
        projTitle.addEventListener('click', () => {
          const open = projBody.style.display === 'none';
          projBody.style.display = open ? 'block' : 'none';
          projTitle.classList.toggle('collapsed', !open);
        });
        const thisYear = new Date().getFullYear();
        let running = currentRent;
        for(let yr = thisYear; yr <= 2032; yr++){
          const row = document.createElement('div');
          row.style.cssText = 'display:flex;justify-content:space-between;font-size:13px;padding:3px 0;';
          const isNow = yr === thisYear;
          row.innerHTML = '<span style="color:' + (isNow ? 'var(--ink)' : 'var(--ink-soft)') + ';">' + yr + (isNow ? ' (current)' : '') + '</span>' +
            '<span style="color:' + (isNow ? 'var(--ink)' : 'var(--ink-soft)') + ';">' + formatMoney(Math.round(running), d.currency) + '</span>';
          projBody.appendChild(row);
          running = running * 1.15;
        }
        const noteRow = document.createElement('div');
        noteRow.style.cssText = 'font-size:11px;color:var(--ink-soft);margin-top:6px;font-style:italic;';
        noteRow.textContent = 'Projected from current rent, compounding 15% per year.';
        projBody.appendChild(noteRow);

        const nextIncreaseDate = (thisYear + 1) + '-08-04';
        const calLink = document.createElement('a');
        calLink.href = googleCalendarUrl(p.name + ' — apply 15% rent increase', nextIncreaseDate, 'Old rent legal increase. New rent: ' + formatMoney(Math.round(currentRent * 1.15), d.currency));
        calLink.target = '_blank';
        calLink.rel = 'noopener';
        calLink.className = 'link-btn';
        calLink.style.display = 'inline-block';
        calLink.style.marginTop = '8px';
        calLink.textContent = 'Add next annual increase to calendar';
        projBody.appendChild(calLink);

        projWrap.appendChild(projBody);
        card.appendChild(projWrap);
      }
    }

    const rentLabel = document.createElement('label');
    rentLabel.textContent = 'Rent due (per month)';
    card.appendChild(rentLabel);
    const rentInput = document.createElement('input');
    rentInput.type = 'text';
    rentInput.value = d.rentAmount;
    rentInput.placeholder = 'e.g. 8500';
    rentInput.addEventListener('change', e => { d.rentAmount = e.target.value; save(p.id); render(); });
    card.appendChild(rentInput);

    const paidRow = document.createElement('div');
    paidRow.className = 'paid-row';
    const isPaid = isPaidForMonth(p.id, viewMonth);
    const paidLabelText = 'Rent for ' + monthLabel(viewMonth) + (d.rentAmount ? (' — ' + formatMoney(d.rentAmount, d.currency)) : '');
    paidRow.innerHTML = '<span class="paid-label">' + paidLabelText + '</span>';
    const paidBtn = document.createElement('button');
    paidBtn.className = 'paid-toggle ' + (isPaid ? 'paid' : 'unpaid');
    paidBtn.textContent = isPaid ? 'Paid' : 'Not paid';
    paidBtn.addEventListener('click', () => {
      const newPaid = !isPaid;
      logPayment(p.id, viewMonth, parseFloat(d.rentAmount) || 0, newPaid);
      render();
    });
    paidRow.appendChild(paidBtn);
    card.appendChild(paidRow);

    const maintLabel = document.createElement('label');
    maintLabel.textContent = 'Maintenance fee due (per month)';
    card.appendChild(maintLabel);
    const maintInput = document.createElement('input');
    maintInput.type = 'text';
    maintInput.value = d.maintenanceAmount;
    maintInput.placeholder = 'e.g. 500';
    maintInput.addEventListener('change', e => { d.maintenanceAmount = e.target.value; save(p.id); render(); });
    card.appendChild(maintInput);

    const maintRow = document.createElement('div');
    maintRow.className = 'paid-row';
    const maintStatus = getMaintenanceStatus(p.id, viewMonth);
    const maintLabelText = 'Maintenance for ' + monthLabel(viewMonth) + (d.maintenanceAmount ? (' — ' + formatMoney(d.maintenanceAmount, d.currency)) : '');
    maintRow.innerHTML = '<span class="paid-label">' + maintLabelText + '</span>';
    const seg = document.createElement('div');
    seg.className = 'seg';
    [['paid','Paid'], ['notpaid','Not paid'], ['na','N/A']].forEach(([val, txt]) => {
      const b = document.createElement('button');
      b.textContent = txt;
      if(maintStatus === val) b.classList.add('active', val);
      b.addEventListener('click', () => {
        logMaintenance(p.id, viewMonth, parseFloat(d.maintenanceAmount) || 0, val);
        render();
      });
      seg.appendChild(b);
    });
    maintRow.appendChild(seg);
    card.appendChild(maintRow);

    if(d.rentalType === 'new'){
    const draftBtn = document.createElement('button');
    draftBtn.className = 'draft-btn';
    draftBtn.textContent = 'Draft a message';
    const draftBox = document.createElement('div');
    draftBox.className = 'draft-box';

    const drafts = relevantDrafts(p);
    const dropdown = document.createElement('select');
    dropdown.className = 'currency';
    dropdown.style.cssText = 'width:100%;font-size:13px;padding:6px 8px;margin-bottom:8px;';
    drafts.forEach((dr, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = dr.label;
      dropdown.appendChild(opt);
    });

    const textarea = document.createElement('textarea');
    textarea.value = drafts[0].text;

    dropdown.addEventListener('change', () => {
      textarea.value = drafts[dropdown.value].text;
    });

    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.textContent = 'Copy';
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(textarea.value).then(() => {
        copyBtn.textContent = 'Copied';
        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
      }).catch(() => {});
    });

    draftBox.appendChild(dropdown);
    draftBox.appendChild(textarea);
    draftBox.appendChild(copyBtn);
    draftBtn.addEventListener('click', () => {
      draftBox.style.display = draftBox.style.display === 'none' ? 'block' : 'none';
    });
    card.appendChild(draftBtn);
    card.appendChild(draftBox);

    const utilWrap = document.createElement('div');
    utilWrap.style.marginTop = '12px';
    utilWrap.style.paddingTop = '12px';
    utilWrap.style.borderTop = '1px solid var(--line)';
    const utilTitle = document.createElement('div');
    utilTitle.className = 'todo-title collapse-title collapsed';
    utilTitle.innerHTML = '<span>Before they leave — bills settled?</span>';
    utilWrap.appendChild(utilTitle);
    const utilBody = document.createElement('div');
    utilBody.style.display = 'none';
    utilTitle.addEventListener('click', () => {
      const open = utilBody.style.display === 'none';
      utilBody.style.display = open ? 'block' : 'none';
      utilTitle.classList.toggle('collapsed', !open);
    });
    const utilLabels = {electricity:'Electricity', gas:'Natural gas', internet:'Internet', phone:'Phone'};
    Object.keys(utilLabels).forEach(key => {
      const row = document.createElement('div');
      row.className = 'todo-item' + (d.utilityChecklist[key] ? ' done' : '');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = d.utilityChecklist[key];
      cb.addEventListener('change', () => { d.utilityChecklist[key] = cb.checked; save(p.id); render(); });
      const span = document.createElement('span');
      span.textContent = utilLabels[key];
      row.appendChild(cb); row.appendChild(span);
      utilBody.appendChild(row);
    });
    const resetUtilBtn = document.createElement('button');
    resetUtilBtn.className = 'link-btn';
    resetUtilBtn.style.marginTop = '6px';
    resetUtilBtn.textContent = 'Reset for new tenant';
    resetUtilBtn.addEventListener('click', () => {
      d.utilityChecklist = {electricity:false, gas:false, internet:false, phone:false};
      save(p.id); render();
    });
    utilBody.appendChild(resetUtilBtn);
    utilWrap.appendChild(utilBody);
    card.appendChild(utilWrap);

    }
  }

  const notesWrap = document.createElement('div');
  notesWrap.style.marginTop = '12px';
  notesWrap.style.paddingTop = '12px';
  notesWrap.style.borderTop = '1px solid var(--line)';
  const notesTitle = document.createElement('div');
  notesTitle.className = 'todo-title collapse-title collapsed';
  const notesMarker = (d.notes && d.notes.trim()) ? '\u2022 ' : '';
  notesTitle.innerHTML = '<span>' + notesMarker + 'Notes</span>';
  notesWrap.appendChild(notesTitle);
  const notesBody = document.createElement('div');
  notesBody.style.display = 'none';
  notesTitle.addEventListener('click', () => {
    const open = notesBody.style.display === 'none';
    notesBody.style.display = open ? 'block' : 'none';
    notesTitle.classList.toggle('collapsed', !open);
  });
  const notesTextarea = document.createElement('textarea');
  notesTextarea.value = d.notes || '';
  notesTextarea.placeholder = 'Standing context about this apartment or tenant \u2014 things that aren\u2019t to-dos. e.g. "hot water tank replaced 2024", "prefers cash over transfer".';
  notesTextarea.style.cssText = 'width:100%;font-family:\'Inter\',sans-serif;font-size:13px;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--cream);resize:vertical;min-height:80px;margin-top:6px;';
  notesTextarea.addEventListener('change', e => { d.notes = e.target.value; save(p.id); });
  notesBody.appendChild(notesTextarea);
  notesWrap.appendChild(notesBody);
  card.appendChild(notesWrap);

  const todoSection = document.createElement('div');
  todoSection.className = 'todo-section';
  const todoTitle = document.createElement('div');
  todoTitle.className = 'todo-title';
  todoTitle.textContent = 'To-do';
  todoSection.appendChild(todoTitle);

  d.todos.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'todo-item' + (item.done ? ' done' : '');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = item.done;
    cb.addEventListener('change', () => { item.done = cb.checked; save(p.id); render(); });
    const span = document.createElement('span');
    span.textContent = item.text;
    const del = document.createElement('button');
    del.textContent = '\u2715';
    del.setAttribute('aria-label', 'Remove item');
    del.addEventListener('click', () => { d.todos.splice(idx,1); save(p.id); render(); });
    row.appendChild(cb); row.appendChild(span); row.appendChild(del);
    todoSection.appendChild(row);
  });

  const addRow = document.createElement('div');
  addRow.className = 'todo-add';
  const addInput = document.createElement('input');
  addInput.type = 'text';
  addInput.placeholder = 'Add something to do';
  const addBtn = document.createElement('button');
  addBtn.textContent = 'Add';
  function addTodo(){
    const val = addInput.value.trim();
    if(!val) return;
    d.todos.push({text:val, done:false});
    addInput.value = '';
    save(p.id); render();
  }
  addBtn.addEventListener('click', addTodo);
  addInput.addEventListener('keydown', e => { if(e.key === 'Enter') addTodo(); });
  addRow.appendChild(addInput); addRow.appendChild(addBtn);
  todoSection.appendChild(addRow);

  card.appendChild(todoSection);
  return card;
}

function renderRentRoll(){
  const wrap = document.createElement('div');
  const rented = PROPERTIES.filter(p => {
    if(p.hidden) return false;
    const d = state[p.id];
    return d && (d.rentalType === 'new' || d.rentalType === 'old');
  });

  const expectedByCcy = {}, collectedByCcy = {};
  const unpaidRows = [], paidRows = [];
  rented.forEach(p => {
    const d = state[p.id];
    const ccy = d.currency || 'EGP';
    const amt = parseFloat(d.rentAmount) || 0;
    expectedByCcy[ccy] = (expectedByCcy[ccy] || 0) + amt;
    const paid = isPaidForMonth(p.id, viewMonth);
    if(paid){
      collectedByCcy[ccy] = (collectedByCcy[ccy] || 0) + amt;
      paidRows.push(p);
    } else {
      unpaidRows.push(p);
    }
  });

  const totals = document.createElement('div');
  totals.className = 'rr-totals';
  const fmtByCcy = obj => Object.keys(obj).length
    ? Object.keys(obj).map(c => obj[c].toLocaleString() + ' ' + c).join(' · ')
    : '\u2014';
  const outstandingByCcy = {};
  Object.keys(expectedByCcy).forEach(c => {
    const out = expectedByCcy[c] - (collectedByCcy[c] || 0);
    if(out > 0) outstandingByCcy[c] = out;
  });
  totals.innerHTML =
    '<div><span class="t-label">Collected:</span><span class="t-value">' + fmtByCcy(collectedByCcy) + '</span></div>' +
    '<div><span class="t-label">Expected:</span><span class="t-value">' + fmtByCcy(expectedByCcy) + '</span></div>' +
    '<div><span class="t-label">Outstanding:</span><span class="t-value">' + fmtByCcy(outstandingByCcy) + '</span></div>';
  wrap.appendChild(totals);

  if(!rented.length){
    const empty = document.createElement('p');
    empty.style.cssText = 'color:var(--ink-soft);font-size:13px;';
    empty.textContent = 'No rented apartments to show.';
    wrap.appendChild(empty);
    return wrap;
  }

  function renderSection(title, rows, kind){
    if(!rows.length) return;
    const head = document.createElement('div');
    head.className = 'rr-section-head';
    head.textContent = title + ' (' + rows.length + ')';
    wrap.appendChild(head);
    rows.forEach(p => {
      const d = state[p.id];
      const row = document.createElement('div');
      row.className = 'rr-row';
      row.setAttribute('role', 'button');
      row.setAttribute('tabindex', '0');
      const open = () => { currentView = 'properties'; detailPropertyId = p.id; window.scrollTo(0,0); document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.view === 'properties')); render(); };
      row.addEventListener('click', open);
      row.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } });

      const nameCell = document.createElement('div');
      nameCell.className = 'rr-cell name';
      nameCell.textContent = p.name;

      const tenantCell = document.createElement('div');
      tenantCell.className = 'rr-cell tenant';
      tenantCell.textContent = d.tenant || '(no tenant name)';

      const amountCell = document.createElement('div');
      amountCell.className = 'rr-cell amount';
      amountCell.textContent = d.rentAmount ? formatMoney(d.rentAmount, d.currency) : '—';

      const statusCell = document.createElement('div');
      statusCell.className = 'rr-cell';
      const pill = document.createElement('span');
      pill.style.cssText = 'font-size:12px;padding:3px 10px;border-radius:20px;font-weight:500;' +
        (kind === 'paid' ? 'background:var(--green-bg);color:var(--green);' : 'background:var(--red-bg);color:var(--red);');
      pill.textContent = kind === 'paid' ? 'Paid' : 'Not paid';
      statusCell.appendChild(pill);

      row.appendChild(nameCell);
      row.appendChild(tenantCell);
      row.appendChild(amountCell);
      row.appendChild(statusCell);
      wrap.appendChild(row);
    });
  }

  renderSection('Still owed', unpaidRows, 'unpaid');
  renderSection('Paid', paidRows, 'paid');

  const note = document.createElement('p');
  note.className = 'saved-note';
  note.textContent = 'Tap any row to open that apartment. Month selector at top changes which month you\u2019re rolling.';
  wrap.appendChild(note);

  return wrap;
}

function computeOverview(){
  const visible = PROPERTIES.filter(p => !p.hidden);
  const rentedVisible = visible.filter(p => {
    const d = state[p.id];
    return d && (d.rentalType === 'new' || d.rentalType === 'old');
  });
  let openTodos = 0;
  const expectedByCcy = {}, collectedByCcy = {};
  const unpaid = [], renewals = [], overdue = [], maintenanceUnpaid = [], taxUnpaid = [];
  const thisYear = new Date().getFullYear();

  visible.forEach(p => {
    const d = state[p.id];
    openTodos += d.todos.filter(t => !t.done).length;
    if(!isTaxPaidForYear(p.id, thisYear, 'realestate') && (parseFloat(d.realEstateTaxAmount) || 0) > 0) taxUnpaid.push(p.name);
    const isRented = d.rentalType === 'new' || d.rentalType === 'old';
    if(isRented){
      const ccy = d.currency || 'EGP';
      const amt = parseFloat(d.rentAmount) || 0;
      expectedByCcy[ccy] = (expectedByCcy[ccy] || 0) + amt;
      const isPaid = isPaidForMonth(p.id, currentMonthKey());
      if(isPaid) collectedByCcy[ccy] = (collectedByCcy[ccy] || 0) + amt;
      else unpaid.push(p.name);
      if(getMaintenanceStatus(p.id, currentMonthKey()) === 'notpaid') maintenanceUnpaid.push(p.name);
      if(d.rentalType === 'new' && d.leaseEnd){
        const daysLeft = Math.round((new Date(d.leaseEnd) - new Date()) / 86400000);
        if(daysLeft < 0) overdue.push({name:p.name, days:daysLeft});
        else if(daysLeft <= 90) renewals.push({name:p.name, days:daysLeft});
      }
    }
  });
  renewals.sort((a,b) => a.days - b.days);
  const fmtByCcy = obj => Object.keys(obj).length
    ? Object.keys(obj).map(c => obj[c].toLocaleString() + ' ' + c).join(' + ')
    : '\u2014';
  return {
    rentedCount: rentedVisible.length,
    totalCount: visible.length,
    expectedStr: fmtByCcy(expectedByCcy),
    collectedStr: fmtByCcy(collectedByCcy),
    unpaid, renewals, overdue, openTodos, maintenanceUnpaid, taxUnpaid
  };
}

function metricCard(label, value){
  const c = document.createElement('div');
  c.className = 'metric-card';
  const l = document.createElement('div');
  l.className = 'metric-label';
  l.textContent = label;
  const v = document.createElement('div');
  v.className = 'metric-value';
  v.textContent = value;
  c.appendChild(l); c.appendChild(v);
  return c;
}

function renderOverview(){
  const wrap = document.createElement('div');
  const o = computeOverview();

  const grid = document.createElement('div');
  grid.className = 'grid';
  grid.style.marginBottom = '24px';
  grid.appendChild(metricCard('Rented units', o.rentedCount + ' of ' + o.totalCount));
  grid.appendChild(metricCard('Expected this month', o.expectedStr));
  grid.appendChild(metricCard('Collected so far', o.collectedStr));
  grid.appendChild(metricCard('Open to-dos', o.openTodos));
  wrap.appendChild(grid);

  function listSection(title, items){
    if(!items.length) return;
    const sec = document.createElement('div');
    sec.style.marginBottom = '20px';
    const heading = document.createElement('div');
    heading.className = 'area';
    heading.textContent = title;
    sec.appendChild(heading);
    items.forEach(text => {
      const row = document.createElement('div');
      row.style.cssText = 'font-size:14px;padding:3px 0;';
      row.textContent = text;
      sec.appendChild(row);
    });
    wrap.appendChild(sec);
  }

  listSection('Not paid yet this month', o.unpaid);
  listSection('Maintenance not paid this month', o.maintenanceUnpaid);
  listSection('Real estate tax not paid this year', o.taxUnpaid);
  listSection('Renewals overdue', o.overdue.map(r => r.name + ' — ' + Math.abs(r.days) + ' days overdue'));
  listSection('Renewing in the next 90 days', o.renewals.map(r => r.name + ' — in ' + r.days + ' days'));

  const yearSec = document.createElement('div');
  const yearHeading = document.createElement('div');
  yearHeading.className = 'area';
  yearHeading.textContent = 'This year, month by month';
  yearSec.appendChild(yearHeading);

  const year = new Date().getFullYear();
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const propCcy = {};
  PROPERTIES.forEach(p => { propCcy[p.id] = (state[p.id] && state[p.id].currency) || 'EGP'; });
  const monthTotals = monthNames.map((_, i) => {
    const key = year + '-' + String(i+1).padStart(2,'0');
    const byCcy = {};
    paymentHistory.filter(h => h.month === key).forEach(h => {
      const c = propCcy[h.propertyId] || 'EGP';
      byCcy[c] = (byCcy[c] || 0) + h.amount;
    });
    return byCcy;
  });
  const maxByCcy = {};
  monthTotals.forEach(byCcy => {
    Object.keys(byCcy).forEach(c => { if(byCcy[c] > (maxByCcy[c] || 0)) maxByCcy[c] = byCcy[c]; });
  });
  monthNames.forEach((m, i) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:4px 0;font-size:13px;';
    const label = document.createElement('div');
    label.style.width = '32px';
    label.textContent = m;
    const barWrap = document.createElement('div');
    barWrap.style.cssText = 'flex:1;background:var(--gray-bg);border-radius:4px;height:14px;overflow:hidden;';
    const byCcy = monthTotals[i];
    const primaryCcy = Object.keys(byCcy).sort((a,b) => byCcy[b] - byCcy[a])[0];
    const barPct = primaryCcy ? (byCcy[primaryCcy] / (maxByCcy[primaryCcy] || 1) * 100) : 0;
    const bar = document.createElement('div');
    bar.style.cssText = 'height:100%;background:var(--green-bg);border-right:2px solid var(--green);width:' + barPct + '%;';
    barWrap.appendChild(bar);
    const val = document.createElement('div');
    val.style.cssText = 'min-width:120px;text-align:right;color:var(--ink-soft);';
    val.textContent = Object.keys(byCcy).length
      ? Object.keys(byCcy).map(c => byCcy[c].toLocaleString() + ' ' + c).join(' + ')
      : '\u2014';
    row.appendChild(label); row.appendChild(barWrap); row.appendChild(val);
    yearSec.appendChild(row);
  });
  wrap.appendChild(yearSec);

  const note = document.createElement('p');
  note.className = 'saved-note';
  note.style.marginTop = '20px';
  note.textContent = 'The year view fills in as rent gets marked paid each month — it starts empty.';
  wrap.appendChild(note);

  return wrap;
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if(!btn) return;
  currentView = btn.dataset.view;
  detailPropertyId = null;
  editingId = null;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

loadAll();
